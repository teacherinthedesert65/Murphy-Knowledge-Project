<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#0b1824"/><text x="600" y="70" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="40" font-weight="700">HEALTHSPAN ≠ LIFESPAN</text><line x1="130" y1="500" x2="1070" y2="500" stroke="#cdefff" stroke-width="5"/><g font-family="Arial,sans-serif"><rect x="180" y="230" width="700" height="90" rx="45" fill="#3d9b8f"/><rect x="180" y="350" width="850" height="90" rx="45" fill="#56708d"/><text x="210" y="288" fill="#fff" font-size="34" font-weight="700">HEALTHSPAN</text><text x="210" y="408" fill="#fff" font-size="34" font-weight="700">LIFESPAN</text><text x="895" y="288" fill="#dffaf4" font-size="25">years in good health</text><text x="895" y="408" fill="#e5efff" font-size="25">total years lived</text><text x="180" y="565" fill="#cdefff" font-size="27">The geroscience goal: compress disease and disability toward the end of life.</text></g></svg>